<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">

  <title>Admin Login | F2C Finance</title>

  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap">

  <link rel="stylesheet" href="styles.css">
</head>

<body data-page="login">

  <main style="min-height:100dvh;display:grid;place-items:center;padding:20px;background:var(--bg2)">

    <div class="form-card" style="width:min(440px,100%)">

      <h1 style="font-size:1.8rem;margin-bottom:6px">
        Admin Login
      </h1>

      <p class="hint" style="margin-bottom:18px">
        Authorised staff only.
      </p>

      <form id="adminLogin" novalidate>

        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          >
        </div>

        <p
          class="err"
          id="aerr"
          role="alert"
          aria-live="polite"
        ></p>

        <button
          class="btn btn-primary"
          id="adminLoginButton"
          style="width:100%"
          type="submit"
        >
          Log in
        </button>

      </form>

    </div>

  </main>

  <div id="toast"></div>
  <dialog id="dlg"></dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script src="js/config.js"></script>

  <script>
/* DEBUG GUARD: login refresh nahi hoga, aur JS load fail hua to screen pe error dikhega */
(function(){
  function show(msg){
    var f=document.querySelector("form")||document.getElementById("regApp");
    if(!f)return;
    var n=document.getElementById("jsFail");
    if(!n){n=document.createElement("p");n.id="jsFail";n.className="notice err";n.setAttribute("role","alert");f.parentNode.insertBefore(n,f);}
    n.textContent=msg;
  }
  window.__showJsFail=show;
  document.addEventListener("submit",function(e){e.preventDefault();},true);
  window.addEventListener("error",function(e){show("JS error: "+(e.message||e.filename||"script load failed"));});
  window.addEventListener("unhandledrejection",function(e){show("JS error: "+((e.reason&&e.reason.message)||e.reason));});
})();
</script>
<script type="module" src="js/admin.js" onerror="__showJsFail('js/admin.js load nahi hua (404 / path galat). Network tab check karo.')"></script>

</body>
</html>
